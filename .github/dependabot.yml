version: 2
# No `target-branch`: Dependabot targets the default branch (`dev`), which is
# what we want. Setting it explicitly also stops security-update PRs from
# using the commit prefixes below.
#
# A group covers scheduled version updates only, unless it says
# `applies-to: security-updates`. Security PRs open the day an advisory
# lands, not on the schedule, so each npm entry carries a `security` group
# too: a burst of advisories arrives as one PR instead of one per package.
updates:
  # npm / pnpm dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commit prefix so the squashed PR title matches our PR-title
      # lint and release-please picks dependency bumps into the changelog.
      prefix: deps
      prefix-development: chore
    groups:
      # Collapse the noise: one PR for all non-major updates.
      minor-and-patch:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Wait a week after an action release before proposing it (supply-chain
    # margin: a compromised tag is usually caught and pulled within days).
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      # One PR a month for ALL action bumps (including majors). Actions are
      # low-risk and quick to eyeball together; no need for a PR each.
      actions:
        patterns:
          - "*"
