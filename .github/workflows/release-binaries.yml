name: Publish standalone binaries

# Fires on the same release event as npm-publish.yml, so a single GitHub
# Release produces both the npm package and the standalone binaries. The
# infra Railway proxy (`get.devicecloud.dev`) reads from the GitHub Releases
# API at runtime, so no separate manifest deploy is needed.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-binaries:
    runs-on: k8s
    permissions:
      contents: write  # Required to upload release assets
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Build binaries for all platforms
        run: node scripts/build-binaries.mjs

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.name }}" \
            dist-bin/dcd-darwin-arm64 \
            dist-bin/dcd-darwin-x64 \
            dist-bin/dcd-linux-arm64 \
            dist-bin/dcd-linux-x64 \
            dist-bin/dcd-windows-x64.exe \
            dist-bin/SHA256SUMS \
            --clobber
