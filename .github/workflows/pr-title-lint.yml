name: PR Title

# Enforces Conventional Commits on the PR *title*. Because PRs are squash-merged
# with the title as the commit subject, this is what scripts/stable-release.mjs
# parses to compute version bumps and the changelog, so the allowed types below
# must stay in sync with SECTIONS and HIDDEN there.
#
# Uses pull_request_target so it also runs (and reports a required status check)
# on PRs from forks. It only reads the title — no untrusted code is checked out.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in lockstep with SECTIONS and HIDDEN in scripts/stable-release.mjs.
          types: |
            feat
            fix
            perf
            deps
            revert
            refactor
            docs
            chore
            test
            ci
            build
            style
