name: CLI CI

on:
  push:
    branches: [ dev, production ]
  pull_request:
    # `production` is included so the dev→production promotion PR is also gated
    # by lint/typecheck/build (and is required by the production ruleset).
    branches: [ dev, production ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v7
      with:
        # Full history so gitleaks scans every commit, not just the tip.
        fetch-depth: 0

    - name: Run gitleaks
      env:
        # Pinned release; bump deliberately. Run the binary directly rather than
        # gitleaks/gitleaks-action@v2, which requires a paid GITLEAKS_LICENSE for
        # organization-owned repos.
        GITLEAKS_VERSION: 8.30.1
      run: |
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        # --log-opts=HEAD scopes the scan to commits reachable from what's
        # checked out: the whole history of this branch (or of the PR merge
        # commit, i.e. base + PR commits), but NOT unrelated branches.
        # `fetch-depth: 0` fetches refs/heads/* — every branch — and gitleaks
        # otherwise scans all of them, so an open branch that legitimately
        # commits a high-entropy value plus its own .gitleaks.toml allowlist
        # would fail every OTHER branch's scan, which is judged against the
        # allowlist at its own tip. Each branch is still fully scanned by its
        # own PR, and pushes to dev/production scan their full history.
        ./gitleaks git . --redact --verbose --no-banner --log-opts=HEAD

  lint-and-test:
    runs-on: ubuntu-latest

    # This repo is PUBLIC and runs no step that reaches into the private
    # devicecloud-dev/dcd repo. It used to check out that repo's mock-api over an
    # SSH deploy key to run test/integration/*, which meant a private-repo
    # credential lived in a public repo's secrets and the API's OpenAPI spec was
    # pulled onto the runner on every same-repo PR. dcd#1036 deleted that mock-api;
    # rather than re-point at it, the linkage is gone.
    #
    # The consequence is deliberate: test/integration/* does NOT run here, and
    # neither does the swagger contract-drift check it provided (spec drift used to
    # surface as a Prism 422). Only test/unit/* runs — pure, no backend. To run the
    # integration suite locally, point MOCK_API_DIR at a mock; see CLAUDE.md.
    steps:
    - name: Checkout CLI
      uses: actions/checkout@v7
      with:
        path: cli

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 10
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: './cli/pnpm-lock.yaml'

    - name: Install CLI dependencies
      working-directory: ./cli
      run: pnpm install --frozen-lockfile

    - name: Run CLI linter
      working-directory: ./cli
      run: pnpm lint

    - name: Type check (strict, src + tests)
      working-directory: ./cli
      run: pnpm typecheck

    - name: Run CLI unit tests
      working-directory: ./cli
      run: pnpm test:unit

    - name: Note skipped integration tests
      run: echo "::notice::Integration tests are not run in CI — they need a mock of the dcd API, and this public repo does not reach into the private one. Lint, typecheck, unit tests, build and audit all ran."

    - name: Build CLI
      working-directory: ./cli
      run: pnpm build

    - name: Security audit
      working-directory: ./cli
      run: pnpm audit --audit-level moderate

  # Anything merging into `production` must carry a plain X.Y.Z version in
  # package.json. This is the exact failure that stalled 5.6.0: the promotion
  # merge dragged dev's `5.6.0-beta.1` across, and release-please's node updater
  # takes package.json as the current version — its own log read
  # `updating from 5.6.0-beta.1 to 5.6.0-beta.1` — so the stable Release PR
  # proposed a prerelease AS the stable release, and production sat unpublishable.
  #
  # npm-publish.yml asserts the same thing, but only reaches it once the Release
  # PR has merged and the tag and GitHub Release already exist. Catching it on the
  # PR is the difference between a red check and a half-published release.
  #
  # This also passes on release-please's own Release PR, which sets the stable
  # version — so it does not need an exemption.
  production-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
    # Default checkout on a pull_request is the merge ref, so this is the version
    # production would actually end up with, not the head branch's in isolation.
    - uses: actions/checkout@v7

    - name: package.json version must be a stable release
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./package.json').version")
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "package.json is $VERSION"
          exit 0
        fi
        echo "::error::production's package.json version would become '$VERSION', which is not a plain X.Y.Z."
        {
          echo "A promotion merge brings dev's version across. If dev is mid-beta, reset it"
          echo "on the promotion branch to production's last stable before opening the PR:"
          echo
          echo "    npm pkg set version=\$(git show origin/production:package.json | node -p \"JSON.parse(require('fs').readFileSync(0,'utf8')).version\")"
          echo
          echo "release-please rewrites it from .release-please-manifest.json when the Release"
          echo "PR lands; the point is that it must never be a prerelease in the meantime,"
          echo "because release-please reads it as the current version when computing the next."
        } >&2
        exit 1
