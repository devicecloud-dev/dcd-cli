name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (prod or beta)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - beta

jobs:
  build:
    runs-on: k8s
    permissions:
      contents: write  # Required to create and push tags
    steps:
      - uses: actions/checkout@v5
      # Setup .npmrc file to publish to npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      # Version validation for production release
      - name: Validate Production Version
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'prod') }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ $VERSION =~ -beta ]]; then
            echo "Error: Production release cannot have a beta suffix. Current version: $VERSION"
            exit 1
          fi
          echo "Version $VERSION is valid for production release"

      # Version validation for beta release
      - name: Validate Beta Version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'beta' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! $VERSION =~ -beta ]]; then
            echo "Error: Beta release must have a beta suffix. Current version: $VERSION"
            exit 1
          fi
          echo "Version $VERSION is valid for beta release"

      - name: Publish Production Version
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'prod') }}
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Beta Version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type == 'beta' }}
        run: pnpm publish --tag beta --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub tag after successful publish
      - name: Create GitHub Tag
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag
          git tag -a "${TAG_NAME}" -m "CLI Release ${VERSION}"
          git push origin "${TAG_NAME}"

          echo "Created and pushed tag: ${TAG_NAME}"
