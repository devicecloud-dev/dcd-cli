name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # The review needs CLAUDE_CODE_OAUTH_TOKEN, which is NOT exposed to PRs that
    # run without secrets — Dependabot PRs and PRs from forks. Skip them so the
    # check doesn't fail with an empty token; same-repo PRs only.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write so the review agent can post its inline comments — with read it
      # reviews successfully but every posting attempt is denied and the PR
      # gets nothing (the action still exits 0).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required for the review to be posted to the PR: the
          # code-review plugin's spec says "If --comment was NOT provided,
          # stop here. Do not post any GitHub comments." Without it the review
          # runs and is discarded (the log doesn't even show it unless
          # show_full_output is enabled).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Explicitly allow the posting tools (mirrors the plugin command's
          # allowed-tools frontmatter). In headless mode the frontmatter grant
          # doesn't reach the inline-comment MCP tool: PR #9's review hit 46
          # permission denials and posted nothing despite finding issues.
          claude_args: |
            --model claude-opus-4-8 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

